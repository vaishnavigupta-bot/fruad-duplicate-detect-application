name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -q

      # The full pipeline is deterministic (fixed seed), so CI reproduces the
      # exact metrics quoted in the README. Elasticsearch is not exercised here;
      # that benchmark is run locally against a live node.
      - name: Regenerate dataset and reproduce metrics
        run: |
          python src/generate_data.py
          cd src
          python evaluate.py
          python decision.py

      - name: Upload metrics
        uses: actions/upload-artifact@v4
        with:
          name: metrics-py${{ matrix.python-version }}
          path: |
            results/evaluation.json
            results/decisions.json
